plugins {
    id 'com.gradleup.shadow'
    id 'org.jetbrains.kotlin.kapt'
}

def pluginVersion = version.toString()
def generatedSources = layout.buildDirectory.dir('generated/sources/pnauth')
configurations.runtimeClasspath {
    // PacketEvents is a required external plugin and owns Adventure on BungeeCord.
    // Bundling a second copy causes loader-constraint violations in its dialog API.
    exclude group: 'net.kyori', module: 'adventure-api'
    exclude group: 'net.kyori', module: 'adventure-key'
    exclude group: 'net.kyori', module: 'adventure-nbt'
    exclude group: 'net.kyori', module: 'examination-api'
    exclude group: 'net.kyori', module: 'examination-string'
}

// PacketEvents exposes Adventure Component on Bungee, but intentionally omits
// the serializer SPI package. pnAuth's bundled serializers need these three
// tiny API interfaces at runtime; importing only this package avoids a second
// full Adventure API and the loader-constraint conflicts it would cause.
configurations {
    adventureSerializerApi
}




sourceSets {
    main {
        kotlin {
            srcDirs = [
                    file('src/main/kotlin'),
                    file('../bungeecord/src/main/kotlin'),
                    file('../velocity/src/main/kotlin'),
                    file('../paper/src/main/kotlin'),
                    generatedSources
            ]
        }
        resources {
            srcDirs = [file('../bungeecord/src/main/resources'), file('../paper/src/main/resources')]
        }
    }
}

def generateBuildInfo = tasks.register('generatePnAuthBuildInfo') {
    inputs.property('pluginVersion', pluginVersion)
    outputs.file(generatedSources.map { it.file('ru/privatenull/pnauth/velocity/PnAuthBuild.kt') })
    doLast {
        File output = generatedSources.get().file('ru/privatenull/pnauth/velocity/PnAuthBuild.kt').asFile
        output.parentFile.mkdirs()
        output.text = """package ru.privatenull.pnauth.velocity

/** Generated at build time from the Gradle project version. */
object PnAuthBuild {
    const val VERSION: String = "${pluginVersion}"
}
"""
    }
}

tasks.matching { it.name.startsWith('compile') || it.name.startsWith('kapt') }.configureEach {
    dependsOn generateBuildInfo
}

tasks.named('sourcesJar') {
    dependsOn generateBuildInfo
    inputs.files(generateBuildInfo)
}

dependencies {
    compileOnly 'net.md-5:bungeecord-api:1.21-R0.4'
    compileOnly 'net.md-5:bungeecord-protocol:1.21-R0.4'
    compileOnly 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
    compileOnly 'com.github.retrooper:packetevents-velocity:2.13.0'
    compileOnly 'com.github.retrooper:packetevents-bungeecord:2.13.1-SNAPSHOT'
    compileOnly 'com.github.retrooper:packetevents-spigot:2.13.0'
    kapt 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'
    implementation project(':shared')
    implementation 'net.kyori:adventure-text-minimessage:4.26.1'
    implementation 'net.kyori:adventure-text-serializer-gson:4.26.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    adventureSerializerApi('net.kyori:adventure-api:4.26.1') { transitive = false }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'net.md-5:bungeecord-api:1.21-R0.4'
    testImplementation 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'
    testImplementation 'com.github.retrooper:packetevents-velocity:2.13.1-SNAPSHOT'
    testImplementation 'net.kyori:adventure-api:4.26.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('jar') {
    archiveClassifier = 'plain'
}

tasks.named('shadowJar') {
    archiveFileName = "pnAuth-${pluginVersion}.jar"
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    filesMatching('META-INF/*.kotlin_module') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()
    from({ project.configurations.adventureSerializerApi.collect { zipTree(it) } }) {
        include 'net/kyori/adventure/text/serializer/*.class'
    }
    relocate 'org.yaml.snakeyaml', 'ru.privatenull.pnauth.libs.snakeyaml'
    relocate 'net.elytrium.serializer', 'ru.privatenull.pnauth.libs.serializer'
    relocate 'com.fasterxml.jackson', 'ru.privatenull.pnauth.libs.jackson'
    manifest {
        attributes(
                'Implementation-Title': 'pnAuth',
                'Implementation-Version': pluginVersion,
                'Implementation-Vendor': 'privatenull'
        )
    }
}

def verifyRuntimeLayout = tasks.register('verifyRuntimeLayout') {
    dependsOn tasks.named('shadowJar')
    inputs.file(tasks.named('shadowJar').flatMap { it.archiveFile })
    doLast {
        File archive = tasks.named('shadowJar').get().archiveFile.get().asFile
        def entries
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            entries = zip.entries()*.name as Set
        }

        [
                'net/kyori/adventure/text/serializer/ComponentDecoder.class',
                'net/kyori/adventure/text/serializer/ComponentEncoder.class',
                'net/kyori/adventure/text/serializer/ComponentSerializer.class'
        ].each { required ->
            if (!entries.contains(required)) {
                throw new GradleException("Missing required Adventure serializer SPI class: ${required}")
            }
        }
        if (entries.contains('net/kyori/adventure/text/Component.class')) {
            throw new GradleException('pnAuth must not bundle Adventure Component; PacketEvents owns it on BungeeCord')
        }
    }
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('bungee.yml') {
        expand(version: pluginVersion)
    }
    filesMatching('plugin.yml') {
        expand(version: pluginVersion)
    }
}

tasks.named('build') {
    dependsOn verifyRuntimeLayout
}
