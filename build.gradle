plugins {
    id 'com.gradleup.shadow' version '9.6.1' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.1.10' apply false
}

group = 'ru.privatenull'
version = '1.0.0'

allprojects {
    repositories {
        mavenCentral()
        maven {
            name = 'bungee'
            url = uri('https://repo.md-5.net/content/repositories/snapshots/')
        }
        maven {
            name = 'velocity'
            url = uri('https://repo.papermc.io/repository/maven-public/')
        }
        maven {
            name = 'codemc-releases'
            url = uri('https://repo.codemc.io/repository/maven-releases/')
        }
        maven {
            name = 'codemc-snapshots'
            url = uri('https://repo.codemc.io/repository/maven-snapshots/')
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'org.jetbrains.kotlin.jvm'

    group = rootProject.group
    version = rootProject.version

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
            freeCompilerArgs.add("-Xjvm-default=all")
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

tasks.register('dist', Sync) {
    dependsOn ':shared:test', ':plugin:verifyRuntimeLayout', ':hub:shadowJar'
    from(project(':plugin').tasks.named('shadowJar'))
    from(project(':hub').tasks.named('shadowJar'))
    into layout.buildDirectory.dir('dist')
}
