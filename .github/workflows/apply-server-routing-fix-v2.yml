name: Retain server routing patch

on:
  push:
    branches:
      - fix/server-routing-types
    paths:
      - .github/workflows/apply-server-routing-fix-v2.yml

permissions:
  contents: write

jobs:
  patch-commit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/server-routing-types
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Reuse and apply routing patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-server-routing-fix.yml').read_text()
          marker = "          python3 <<'PY'\n"
          body = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          body = body.replace("Path('.github/workflows/apply-server-routing-fix.yml').unlink()", "pass")
          exec(compile(body, 'routing_patch.py', 'exec'))
          PY

      - name: Commit patch to test branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shared velocity bungeecord
          git commit -m "fix: make server route types explicit"
          git push origin HEAD:fix/server-routing-types

      - name: Test and build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean dist
