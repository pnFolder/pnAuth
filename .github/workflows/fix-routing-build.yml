name: Fix routing build

on:
  push:
    branches:
      - fix/server-routing-types
    paths:
      - .github/workflows/fix-routing-build.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/server-routing-types
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Fix escaped validation example
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('shared/src/main/kotlin/ru/privatenull/pnauth/config/AuthConfig.kt')
          text = p.read_text()
          old = '''                throw IOException(
                    "$path must contain at least one server. Example:
" +
                        "$path:
  - server: auth
    online: 100
    type: SERVER"
                )'''
          new = '''                throw IOException(
                    "$path must contain at least one server. Example:\\n" +
                        "$path:\\n  - server: auth\\n    online: 100\\n    type: SERVER"
                )'''
          if old not in text:
              raise SystemExit('Broken validation string not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shared/src/main/kotlin/ru/privatenull/pnauth/config/AuthConfig.kt
          git commit -m "fix: escape routing validation example"
          git push origin HEAD:fix/server-routing-types

      - name: Test and build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean dist
