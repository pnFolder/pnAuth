name: Routing build retry

on:
  push:
    branches:
      - fix/server-routing-types
    paths:
      - .github/workflows/routing-build-retry.yml

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/server-routing-types
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply compile fix
        run: python3 tools/fix-routing-string.py
      - name: Commit compile fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shared/src/main/kotlin/ru/privatenull/pnauth/config/AuthConfig.kt
          git commit -m "fix: escape routing validation example"
          git push origin HEAD:fix/server-routing-types
      - name: Test and build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean dist
