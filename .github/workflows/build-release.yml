name: Build and Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - codex/kotlin-migration
      - main

permissions:
  contents: write

jobs:
  build:
    name: Test and build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release distribution
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean dist

      - name: Generate SHA-256 checksums
        run: |
          cd build/dist
          sha256sum pnAuth-*.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: pnAuth-distribution
          path: |
            build/dist/pnAuth-*.jar
            build/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: pnAuth-distribution
          path: build/dist

      - name: Read release metadata
        id: release
        shell: bash
        run: |
          VERSION=$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle | head -n 1)
          NOTES="docs/releases/v${VERSION}.md"
          if [ -z "$VERSION" ]; then
            echo "Could not read version from build.gradle" >&2
            exit 1
          fi
          if [ ! -f "$NOTES" ]; then
            echo "Missing release notes: $NOTES" >&2
            exit 1
          fi
          TITLE=$(head -n 1 "$NOTES" | sed 's/^# //')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Publish release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          NOTES: ${{ steps.release.outputs.notes }}
          TITLE: ${{ steps.release.outputs.title }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "v${VERSION}" \
            build/dist/pnAuth-${VERSION}.jar \
            build/dist/pnAuth-hub-${VERSION}.jar \
            build/dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$NOTES"
