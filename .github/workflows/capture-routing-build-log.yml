name: Capture routing build log

on:
  push:
    branches:
      - fix/server-routing-types
    paths:
      - .github/workflows/capture-routing-build-log.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/server-routing-types
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run build and capture output
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew --no-daemon clean dist --stacktrace 2>&1 | tee /tmp/pnauth-build.log
          STATUS=${PIPESTATUS[0]}
          mkdir -p diagnostics
          cp /tmp/pnauth-build.log diagnostics/build.log
          echo "$STATUS" > diagnostics/status.txt
          exit 0
      - name: Commit diagnostic log
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/build.log diagnostics/status.txt
          git commit -m "chore: capture routing build log"
          git push origin HEAD:fix/server-routing-types
